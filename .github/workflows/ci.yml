name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.mod
      - run: gofmt -w cmd/ai-init internal/cli internal/agents internal/environment internal/ports
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test ./internal/agents ./internal/environment ./internal/ports
      - run: go test ./internal/cli -run 'TestIntegrate|TestWorktree|TestSetup|TestRunValidation' -count=1
      - run: go test ./...
