version: 2
project_name: ai-init
before:
  hooks:
    - go mod tidy
builds:
  - id: ai-init
    main: ./cmd/ai-init
    binary: ai-init
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: checksums.txt
